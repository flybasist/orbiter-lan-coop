# Example list of OLC test rigs.
#
# Copy this file to stands.yaml (it is in .gitignore and never gets into git) and describe your machines.
# The AI agent works only with machines from stands.yaml; no file - no test rigs.
# How to prepare a machine and which systems are supported - docs/STANDS.md.
#
# Addresses, user and key are not written here: they live in ~/.ssh/config, and this file
# gives only the machine name from there (the ssh field). There are no passwords anywhere.
#
# Machine fields:
#   ssh       - host name in ~/.ssh/config, the agent connects by it
#   where     - where it runs: parallels, vmware, hyper-v, proxmox, hardware, steam-deck
#   os        - system: windows-11, windows-10, debian-13, ubuntu-26.04, steamos, etc.
#   arch      - architecture: x64 or arm64
#   roles     - what the machine is for (a list; values - docs/STANDS.md, section "Machine roles"):
#               build, client, host, headless-host, core-tests
#   access    - what the agent may do on the machine (docs/STANDS.md, section 6):
#               limited - only build, start and stop Orbiter, OLC files, logs;
#               full    - the machine is given to the agent: packages, reboots, settings
#   screen    - how to see the picture: none, mac-window (VM window on the Mac screen),
#               console (hypervisor console, the owner logs in), physical (only at the machine)
#   orbiter   - Orbiter install folder on the machine (empty if Orbiter is not installed)
#   checked   - date of the last check that the machine is ready (YYYY-MM-DD)
#   notes     - anything else: features, limitations

machines:
  - ssh: olc-win-arm
    where: parallels
    os: windows-11
    arch: arm64
    roles: [build, client, host]
    access: limited
    screen: mac-window
    orbiter: 'C:\olc\orbiter'
    checked: 2026-01-01
    notes: Orbiter x64 via emulation - FPS is not meaningful

  - ssh: olc-win-x86
    where: proxmox
    os: windows-10
    arch: x64
    roles: [build, headless-host]
    access: full
    screen: console
    orbiter: 'C:\olc\orbiter'
    checked: 2026-01-01
    notes: no graphics card
