; OrbiterLanCoop plugin settings (stage 1). Put this file into Orbiter's Config folder.
; Without this file the plugin loads but does nothing.

; Role: host, client or off
Role = host

; Client: host address (IPv4 digits only) and player name
HostAddress = 127.0.0.1
Player = player

; TCP and UDP port, the same on host and client
Port = 47800

; Host: player limit (the host is a player too, 2...8) and state rate per second
MaxPlayers = 4
StateRate = 30

; Client: display delay, seconds, and the sim time error threshold against the host
; (seconds at x1 warp) after which the client time catches up with a jump
DisplayDelay = 0.1
TimeSyncThreshold = 0.1

; For measurements: write the position of the vessel with this name to CSV (empty - do not write)
; TraceVessel = GL-01
; TraceFile = olc-trace.csv
