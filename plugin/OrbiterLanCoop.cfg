; OrbiterLanCoop plugin settings. Put this file into Orbiter's Config folder, or set the fields
; in Launchpad: the "Extra" tab, the "OLC - LAN co-op" item (it writes this file).
; Without this file the plugin loads but does nothing.

; Role: host, client or off
Role = host

; Client: host address (IPv4 digits only). Host and client: player name
HostAddress = 127.0.0.1
Player = player

; TCP and UDP port, the same on host and client
Port = 47800

; Host: player limit (the host is a player too, 2...8) and state rate per second
MaxPlayers = 4
StateRate = 60

; Host: player name of the flight director. This client pauses and warps time for everybody,
; flies no vessel. Empty - there is no director.
Director =

; Host: save the world to Scenarios\OLC\Saves\autosave.scn every this many minutes (0 - never).
; The director saves a separate file by Ctrl+Alt+S.
AutosaveMinutes = 10

; Client: display delay, seconds (0.03 for a wired LAN; over Wi-Fi 0.1 is safer), and the
; sim time error threshold against the host
; (seconds at x1 warp) after which the client time catches up with a jump
DisplayDelay = 0.03
TimeSyncThreshold = 0.1

; For measurements: write the position of the vessel with this name to CSV (empty - do not write)
; TraceVessel = GL-01
; TraceFile = olc-trace.csv
