; Настройки плагина OrbiterLanCoop (этап 1). Положите файл в каталог Config Orbiter.
; Без этого файла плагин загружается, но ничего не делает.

; Роль: host, client или off
Role = host

; Клиент: адрес хоста (только IPv4 цифрами) и имя игрока
HostAddress = 127.0.0.1
Player = player

; Порт TCP и UDP, одинаковый у хоста и клиента
Port = 47800

; Хост: предел игроков (хост тоже игрок, 2...8) и частота состояний в секунду
MaxPlayers = 4
StateRate = 30

; Клиент: задержка показа, секунды, и порог расхождения сим-времени с хостом
; (секунды при ускорении x1), после которого время клиента подтягивается прыжком
DisplayDelay = 0.1
TimeSyncThreshold = 0.1

; Для замеров: писать положение корабля с этим именем в CSV (пусто - не писать)
; TraceVessel = GL-01
; TraceFile = olc-trace.csv
