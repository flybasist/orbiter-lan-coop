# OLC build for Windows x64: the network core with tests and the OrbiterLanCoop.dll plugin.
#
# The plugin needs Orbiter.lib and Orbitersdk.lib - they appear only after Orbiter is
# built. So the workflow builds the Orbiter core from the base commit (decision 25 in
# docs/DECISIONS.md) and caches the result by the commit hash: a full build happens only on
# the first run and after the base commit moves.
#
# When the base commit moves (docs/ORBITER-INTERNALS.md, section 13) change
# ORBITER_COMMIT below.

name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ORBITER_COMMIT: a7a3396e6c3104a05fd5ac55736de75e4c0e921f
  ORBITER_SDK: ${{ github.workspace }}\orbiter-sdk

jobs:
  build:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
    - name: Checkout OLC
      uses: actions/checkout@v7

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    # ---------- Orbiter SDK: from the cache or by building ----------

    - name: Cache Orbiter SDK
      id: sdk-cache
      uses: actions/cache@v6
      with:
        path: ${{ env.ORBITER_SDK }}
        key: orbiter-sdk-x64-${{ env.ORBITER_COMMIT }}

    - name: Checkout Orbiter
      if: steps.sdk-cache.outputs.cache-hit != 'true'
      uses: actions/checkout@v7
      with:
        repository: orbitersim/orbiter
        ref: ${{ env.ORBITER_COMMIT }}
        path: orbiter-src

    # Only the core is needed: without the D3D9 graphics client (it needs the DirectX SDK),
    # without XRSound and without Orbiter's tests.
    - name: Build Orbiter core
      if: steps.sdk-cache.outputs.cache-hit != 'true'
      working-directory: orbiter-src
      run: |
        cmake . --preset windows-x64-release -DORBITER_BUILD_D3D9CLIENT=OFF -DORBITER_BUILD_XRSOUND=OFF -DORBITER_MAKE_TESTS=OFF
        cmake --build --preset windows-x64-release --target Orbiter Orbitersdk --jobs 2

    # Headers come from the repository, libraries from the build folder.
    - name: Collect Orbiter SDK
      if: steps.sdk-cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $build = "orbiter-src\out\build\windows-x64-release"
        New-Item -ItemType Directory -Force "$env:ORBITER_SDK\lib" | Out-Null
        Copy-Item -Recurse "orbiter-src\Orbitersdk\include" "$env:ORBITER_SDK\include"
        foreach ($name in "Orbiter.lib", "Orbitersdk.lib") {
          $file = Get-ChildItem -Path $build -Recurse -Filter $name | Select-Object -First 1
          if (-not $file) { throw "$name not found in $build" }
          Write-Host "Found $($file.FullName)"
          Copy-Item $file.FullName "$env:ORBITER_SDK\lib\$name"
        }

    # ---------- OLC ----------

    - name: Configure OLC
      run: cmake -S . -B orbiter-lan-coop.out -G Ninja -DCMAKE_BUILD_TYPE=Release -DOLC_ORBITER_SDK_DIR="${{ env.ORBITER_SDK }}"

    - name: Build OLC
      run: cmake --build orbiter-lan-coop.out

    - name: Test OLC core
      run: ctest --test-dir orbiter-lan-coop.out --output-on-failure

    - name: Upload plugin
      uses: actions/upload-artifact@v7
      with:
        name: OrbiterLanCoop-x64
        path: orbiter-lan-coop.out/plugin/OrbiterLanCoop.dll
        retention-days: 14
