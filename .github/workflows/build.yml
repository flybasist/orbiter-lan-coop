# Сборка OLC под Windows x64: сетевое ядро с тестами и плагин OrbiterLanCoop.dll.
#
# Плагину нужны Orbiter.lib и Orbitersdk.lib - они появляются только после сборки
# Orbiter. Поэтому workflow собирает ядро Orbiter из базового коммита (решение 25 в
# docs/DECISIONS.md) и кеширует результат по хешу коммита: полная сборка - только при
# первом запуске и после переноса базового коммита.
#
# При переносе базового коммита (docs/ORBITER-INTERNALS.md, раздел 13) поменять
# ORBITER_COMMIT ниже.

name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ORBITER_COMMIT: b0c518ab2531982c563c141342bd9d181e90597b
  ORBITER_SDK: ${{ github.workspace }}\orbiter-sdk

jobs:
  build:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
    - name: Checkout OLC
      uses: actions/checkout@v7

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    # ---------- SDK Orbiter: из кеша или сборкой ----------

    - name: Cache Orbiter SDK
      id: sdk-cache
      uses: actions/cache@v6
      with:
        path: ${{ env.ORBITER_SDK }}
        key: orbiter-sdk-x64-${{ env.ORBITER_COMMIT }}

    - name: Checkout Orbiter
      if: steps.sdk-cache.outputs.cache-hit != 'true'
      uses: actions/checkout@v7
      with:
        repository: orbitersim/orbiter
        ref: ${{ env.ORBITER_COMMIT }}
        path: orbiter-src

    # Нужно только ядро: без графического клиента D3D9 (ему нужен DirectX SDK),
    # без XRSound и без тестов Orbiter.
    - name: Build Orbiter core
      if: steps.sdk-cache.outputs.cache-hit != 'true'
      working-directory: orbiter-src
      run: |
        cmake . --preset windows-x64-release -DORBITER_BUILD_D3D9CLIENT=OFF -DORBITER_BUILD_XRSOUND=OFF -DORBITER_MAKE_TESTS=OFF
        cmake --build --preset windows-x64-release --target Orbiter Orbitersdk --jobs 2

    # Заголовки берутся из репозитория, библиотеки - из каталога сборки.
    - name: Collect Orbiter SDK
      if: steps.sdk-cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $build = "orbiter-src\out\build\windows-x64-release"
        New-Item -ItemType Directory -Force "$env:ORBITER_SDK\lib" | Out-Null
        Copy-Item -Recurse "orbiter-src\Orbitersdk\include" "$env:ORBITER_SDK\include"
        foreach ($name in "Orbiter.lib", "Orbitersdk.lib") {
          $file = Get-ChildItem -Path $build -Recurse -Filter $name | Select-Object -First 1
          if (-not $file) { throw "$name not found in $build" }
          Write-Host "Found $($file.FullName)"
          Copy-Item $file.FullName "$env:ORBITER_SDK\lib\$name"
        }

    # ---------- OLC ----------

    - name: Configure OLC
      run: cmake -S . -B orbiter-lan-coop.out -G Ninja -DCMAKE_BUILD_TYPE=Release -DOLC_ORBITER_SDK_DIR="${{ env.ORBITER_SDK }}"

    - name: Build OLC
      run: cmake --build orbiter-lan-coop.out

    - name: Test OLC core
      run: ctest --test-dir orbiter-lan-coop.out --output-on-failure

    - name: Upload plugin
      uses: actions/upload-artifact@v7
      with:
        name: OrbiterLanCoop-x64
        path: orbiter-lan-coop.out/plugin/OrbiterLanCoop.dll
        retention-days: 14
